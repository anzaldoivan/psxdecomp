name: ci
on:
  push:
    branches: ["**"]              # not tags: release.yml runs these tiers for a tag (workflow_call)
  pull_request:
  schedule:
    - cron: "17 4 * * 1"          # weekly: tier 1b (the pipeline smoke) and tier 5a (the C corpus), in containers
  workflow_dispatch:
  workflow_call:                  # release.yml runs the same tiers before it drafts a release

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  firewall:
    name: firewall (no game bytes in the tree)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: The repo's own firewall, with its control (the check that the default-branch ruleset requires)
        run: python tools/audit_public.py --self-test && python tools/audit_public.py

  tier0:
    name: tier 0 (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.14"]      # the floor, and the interpreter compat.toml [tested_on] records
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "${{ matrix.python }}" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "20" }
      - name: Claude Code at the tested version (compat.toml [tested_on].claude), for `claude plugin validate`
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('compat.toml','rb'))['tested_on']['claude'])")
          npm install -g "@anthropic-ai/claude-code@$v"
          claude --version
      - run: pip install pytest pyyaml
      - name: ripgrep, for the search test of the stale-lead folders (it skips without it)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y --no-install-recommends ripgrep; else brew install ripgrep; fi
          rg --version | head -1
      - name: Static checks, eval schemas and grader controls, every script's self-test
        run: pytest -q -rs tests/test_static.py tests/test_scripts.py

  tier1:
    name: tier 1 (the installer on the homebrew fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - name: Cache the pinned kit clone (keyed by the pins; PA3 is cloned per run into a temp dir)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/psxdecomp
          key: psxdecomp-pins-${{ hashFiles('compat.toml') }}
      - run: pip install pytest pyyaml
      - name: Tier 1 — PA3 cloned at its pin; the kit from compat.toml [kit].repo + sha, digest-checked
        # The kit is fetched shallow and sparse at compat.toml [kit].sha and digest-checked; the cache above keeps it.
        run: pytest -q -rs tests/test_pipeline.py tests/test_split_e2e.py

  tier1b-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tier 1b — extract, split, all-asm build, hash, in the profile container
        run: bash fixtures/homebrew-psx/smoke/run.sh

  tier5a-corpus:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tier 5a — every truth matches itself, every mutant fails, every fake twin matches and is flagged
        run: bash fixtures/c-corpus/run.sh
