name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"          # weekly: tier 1b (the pipeline smoke in the profile container)
  workflow_dispatch:
  workflow_call:                  # release.yml runs the same tiers before it drafts a release

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  tier0:
    name: tier 0 (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.14"]      # the floor, and the interpreter compat.toml [tested_on] records
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "${{ matrix.python }}" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "20" }
      - name: Claude Code at the tested version (compat.toml [tested_on].claude), for `claude plugin validate`
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('compat.toml','rb'))['tested_on']['claude'])")
          npm install -g "@anthropic-ai/claude-code@$v"
          claude --version
      - run: pip install pytest pyyaml
      - name: The repo's own firewall, with its control
        run: python tools/audit_public.py --self-test && python tools/audit_public.py
      - name: Static checks, eval schemas and grader controls, every script's self-test
        run: pytest -q -rs tests/test_static.py tests/test_scripts.py

  tier1:
    name: tier 1 (the installer on the homebrew fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Cache the pinned kit clone (keyed by the pins; PA3 is cloned per run into a temp dir)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/psxdecomp
          key: psxdecomp-pins-${{ hashFiles('compat.toml') }}
      - run: pip install pytest pyyaml
      - name: Tier 1 — PA3 cloned at its pin; the kit from compat.toml [kit].repo + sha, digest-checked
        # Until the kit is published ([kit].repo empty), these tests skip with that reason; run them locally with
        # PSXDECOMP_KIT=<kit folder>.
        run: pytest -q -rs tests/test_pipeline.py

  tier1b-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tier 1b — extract, split, all-asm build, hash, in the profile container
        run: bash fixtures/homebrew-psx/smoke/run.sh
