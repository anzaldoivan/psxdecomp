# profiles/psx/psyq.toml — the one home for PsyQ SDK -> toolchain LEADS (psxdecomp research B2, 2026-10-01).
# A row says what a release shipped and what matched elsewhere; it is never a game's pin (that is phase 1.4's finding).
# S10 copies the ONE row matching the game's stamps into config/psxdecomp.toml [psyq]; this file is not installed.
#
# [[version]] fields: id (identify.py's psyq_version output) · stamp (the Ps halfword as DetectPsyQ names it; "" for
# releases <=3.5, which carry no stamp and are found by signature only) · dtl (Sony part number) · dated (the earliest
# dated anchor) · ships_compiler (yes|no|unknown) · cc1_banner (the shipped cc1's banner) · aspsx (shipped ASPSX) ·
# old_gcc (the decompals/old-gcc build that matches the shipped cc1: a matching equivalent, not provenance; maspsx's
# flag follows from aspsx) · decompme_id · gdt (ghidra_psx_ldr data/ type archive) · confidence
# (measured|secondary|conflict|unknown) · sources [{src, seen}].
# [[seen_in]]: matching repos that state their triple (game_triple for the game's code, lib_triple when the libraries
# were matched separately). A triple proven at a gate lands here (docs/HARVEST.md).

[meta]
seen      = "2026-10-01"
authority = "ghidra_psx_ldr DetectPsyQ (the final word on which libraries the game links; refs.toml [[authority]])"
libraries = "per-version library sets and signatures: github.com/lab313ru/ghidra_psx_ldr data/ and lab313ru/psx_psyq_signatures (linked, not copied)"

