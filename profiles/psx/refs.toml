# profiles/psx/refs.toml — the PS1 profile's reference library, CURATED from use: a source is here because a real
# project went to it (mmx6 2026-10-01, BFM-decomp 2026-06..09). The evidence for each row is its `used_by` line.
#
# `tier = "core"`: fetched at bootstrap (S9). `tier = "optional"`: in the index, fetched on demand
# (`fetch_refs.py --with <name>`) when its `when` condition holds. Licences were read from each source on `checked`.
# `covers` says exactly which version or scope the source speaks for: a grep hit is only an answer within it.
# [[authority]] names which source wins per topic; [[trap]] records contradictions a project already paid for.

