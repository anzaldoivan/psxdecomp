# ---- which source wins, per topic ---------------------------------------------------------------------------------

[[authority]]
topic = "compiler behaviour (why cc1 emitted this)"
order = ["gcc-2.7.2-src", "gcc-2.95.2-src", "old-gcc"]
scope = "per topic, refs audit 2026-10-01"
rule  = "only the source of the PINNED version, plus old-gcc's patches for a -psx build; never another gcc's source"

[[authority]]
topic = "which compiler builds exist, how they are built"
order = ["old-gcc"]
rule  = "read the Dockerfile as it runs, not the build's name"

[[authority]]
topic = "assembler-shim flags (aspsx version, expand-div)"
order = ["maspsx"]
rule  = "a sibling project's flags are a lead for the ladder, never the pin"

[[authority]]
topic = "which PsyQ library function sits at an address"
order = ["ghidra-psx-ldr", "psyq-sdk"]
rule  = "signatures of the version matching the game's stamps; byte-verify against byo libraries when supplied"

[[authority]]
topic = "which PsyQ version the game links"
order = ["ghidra-psx-ldr"]
rule  = "its DetectPsyQ decides; identify.py's Ps-stamp probe agrees on stamped games; PsyQ <=3.5 has no stamp and is signature-only"

[[authority]]
topic = "PsyQ API: signatures, headers, struct layouts"
order = ["psyq-sdk", "psy-q-decomp", "sotn-decomp"]
rule  = "the byo SDK of the stamped version wins; psy-q-decomp only at that version; sotn's psxsdk is a fallback with non-Sony extensions"

[[authority]]
topic = "hardware"
order = ["psx-spx"]
rule  = "psx-spx over any SDK header comment"

[[authority]]
topic = "splitter configuration"
order = ["splat", "sotn-decomp"]
rule  = "splat's own segment types first; sotn for a multi-overlay layout precedent"

# ---- contradictions already paid for ------------------------------------------------------------------------------

[[trap]]
what     = "pmret/gcc-papermario is gcc 2.8.1, not 2.7.2: some optimisation paths differ (2.8.1 disables biv-elim paths 2.7.2 runs)"
evidence = "BFM Phase 23 (docs/SETUP.md reference table)"
do       = "cite only the vanilla source of the pinned version (gcc-2.7.2-src)"

[[trap]]
what     = "ftp.gnu.org/gnu/gcc has only gcc-2.7.2.3; the gcc-2.7.2 tarball the -psx builds use is under /old-gnu/"
evidence = "psxdecomp refs audit 2026-10-01; decompals/old-gcc gcc-2.7.2*.Dockerfile"
do       = "gcc-2.7.2-src pins the /old-gnu/ tarball by sha256"

[[trap]]
what     = "sotn-decomp's include/psxsdk/libgte.h adds 7 gte_* macros Sony's inline_c.h does not have"
evidence = "BFM Phase 36 log"
do       = "treat sotn's psxsdk headers as a project's, not Sony's; check the byo SDK"

[[trap]]
what     = "a build rule's name is not its toolchain: mmx4's cc1_263/aspsx_263 rules run gcc 2.7.2 and maspsx 2.56"
evidence = "mmx6 docs/prior-art.md Corrections (P4, 2026-10-01)"
do       = "read what a sibling's build actually runs before recording its pin"

[[trap]]
what     = "PSn00bSDK is an open SDK with its own API; same-named functions do not share PsyQ's semantics"
evidence = "psxdecomp refs audit 2026-10-01 (dropped from the library)"
do       = "never answer a PsyQ question from PSn00bSDK"

[[trap]]
what     = "Ps stamps date the linked PsyQ libraries, not the compiler the game's own code was built with"
evidence = "mmx6 (4.7 libraries, game gcc 2.95.2); ygofm-decomp (4.6 libraries, game gcc 2.8.1); BFM (4.0 libraries, mixed cc1s); psxdecomp research B2 C1, 2026-10-01"
do       = "treat config/psxdecomp.toml [psyq] as a lead for the compiler phase; pin the compiler from matched bytes"

[[trap]]
what     = "a PsyQ release need not ship a compiler: 4.2 is library-only and psyq47.zip holds no .EXE (decomp.me has no psyq4.2/4.7 id)"
evidence = "BFM docs/SETUP.md 5.2; ygofm-decomp docs/DECISIONS.md (2026-08-31); decomp.me compilers.py (seen 2026-10-01)"
do       = "for a 4.2 or 4.7 game, take compiler candidates from other releases and from sibling repos, never from 'the SDK's cc1'"

[[trap]]
what     = "archive folder labels are unreliable: the '4.5 bundle' cc1 reports the 2.8.1 SN32 banner BFM measured for 4.4"
evidence = "ygofm-decomp docs/DECISIONS.md vs BFM docs/SETUP.md 5.2 (psxdecomp research B2 C3, 2026-10-01)"
do       = "identify a cc1 by its banner (strings CC1PSX.EXE), never by the folder or archive it came in"

[[trap]]
what     = "Sony built the libraries with an older cc1 than the SDK shipped (4.7 libs: patched gcc 2.7.2 plus some SN 2.8.1 objects), and stock old-gcc does not match those 4.7 library objects"
evidence = "dw3_decomp PR 4 (2026-09-26) and README; dcb_decomp README; NFSHS build.py (psxdecomp research B2 C4/C5, 2026-10-01)"
do       = "keep library code as asm or link the user's own objects; do not pin the game's compiler from a library match"

[[trap]]
what     = "a one-triple compiler pin is a finding, not a default: per-module compiler mixing is common (Xenogears 3 cc1s, FF8 lanes, Legend of Mana 4 compilers)"
evidence = "decomp.dev projects and their build files (psxdecomp research B2 C9, seen 2026-10-01)"
do       = "pin per module when bytes demand it; record one triple only after every module class matched under it"

[[trap]]
what     = "not every PS1 game is PsyQ gcc: Digimon World uses Metrowerks CodeWarrior PS R4 (mw_lib41); the THPS2 demo uses unmodified egcs 1.1.2"
evidence = "jype0/dw_decomp README; thps2-demo-decomp README (psxdecomp research B2 C13, seen 2026-10-01)"
do       = "let the bytes (prologue idioms, library signatures) pick the compiler family before assuming a PsyQ cc1"

[[trap]]
what     = "decomp.me's gcc2.7.2-psx is not a repo's toolchain: old-gcc release 0.13 vs BFM's 0.17, another maspsx commit, and gas pads .text to 16 bytes"
evidence = "BFM tools/decompme_replica.sh header (P33 E1, 2026-09-07)"
do       = "prove a preset through the kit's decompme_replica before saving it; read the verdict, not the .text size"
