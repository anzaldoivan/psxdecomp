# .github/workflows/psxdecomp-readme.yml — the README standard, the writing style of the public prose files, the
# readability debt of the source and the frozen category ids (written by psxdecomp's S10 and /psxdecomp:upgrade, which
# own this file; the standard is psxdecomp's docs/PUBLISHING.md, the debt kinds are docs/ops/psxdecomp-floor.md). No
# game data needed: it reads README.md, the public prose files (every published `.md` file), the tracked source,
# config/style-ratchet.txt, config/debt-baseline.txt, config/names.tsv, config/asm-evidence.tsv,
# config/public-paths.txt, config/categories.tsv, config/discs.tsv and the tracked hash records.
name: psxdecomp-readme

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readme:
    name: README standard and category ids
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # the category freeze reads every committed version of config/categories.tsv
          persist-credentials: false
      - name: README lint (sections, AI policy, generated blocks fresh, badges, paths, links)
        run: python3 tools/psxd_publish.py lint README.md
      - name: "writing style of the public prose files (a count may only fall: config/style-ratchet.txt)"
        run: python3 tools/psxd_publish.py style
      - name: "readability debt of the source (each count equal to its row: config/debt-baseline.txt)"
        run: python3 tools/psxd_floor.py debt
      - name: category ids frozen (retired, never deleted or renamed)
        run: python3 tools/psxd_publish.py categories config/categories.tsv --history
