# .github/workflows/psxdecomp-readme.yml — the gate of the floor: the README standard, the writing style of the public
# prose files, the readability debt of the source with its ledgers, and the frozen category ids
# (written by psxdecomp's S10 and /psxdecomp:upgrade, which own this file; the standard is psxdecomp's docs/PUBLISHING.md, and `python3 tools/psxd_floor.py --help` lists the debt kinds). No
# game data needed: it reads README.md, the public prose files (every published `.md` file), the tracked source,
# config/style-ratchet.txt, config/debt-baseline.txt, config/names.tsv, config/asm-evidence.tsv,
# config/public-paths.txt, config/categories.tsv, config/discs.tsv and the tracked hash records.
name: psxdecomp-readme

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readme:
    name: the gate of the floor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # the gate reads the base of the change, and the category freeze every version
          persist-credentials: false
      # One command holds every check of the floor (`python3 tools/psxd_floor.py --help`): the README lint, the
      # writing style, the readability debt, the ledgers, the category ids and the files that carry
      # the floor. The tools that judge are the ones of the commit that the change starts from, copied out of git: a
      # change cannot rewrite its own judge. A tool that the change replaces must be a released psxdecomp tool.
      - name: "the gate: the change against its base, with the tools of the base commit"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          judge="$RUNNER_TEMP/psxd-judge"
          mkdir -p "$judge"
          case "$BASE" in
            ""|0000000000000000000000000000000000000000) BASE=$(git merge-base HEAD "origin/$DEFAULT_BRANCH" 2>/dev/null || true) ;;
          esac
          if [ -n "$BASE" ] && git show "$BASE:tools/psxd_floor.py" > "$judge/psxd_floor.py" 2>/dev/null \
              && git show "$BASE:tools/psxd_publish.py" > "$judge/psxd_publish.py" 2>/dev/null \
              && python3 "$judge/psxd_floor.py" gate --help > /dev/null 2>&1; then
            python3 "$judge/psxd_floor.py" gate --ci "$BASE..HEAD"
          else
            echo "::notice::the base commit holds no gate yet: the tools of this commit judge it, this once"
            python3 tools/psxd_floor.py gate --ci "${BASE:-0000000000000000000000000000000000000000}..HEAD"
          fi
