# .github/workflows/psxdecomp-readme.yml — the README standard and the frozen category ids (written by psxdecomp's S10
# and /psxdecomp:upgrade, which own this file; the standard is psxdecomp's docs/PUBLISHING.md). No game data needed:
# it reads README.md, config/categories.tsv, config/discs.tsv and the tracked hash records.
name: psxdecomp-readme

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readme:
    name: README standard and category ids
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # the category freeze reads every committed version of config/categories.tsv
          persist-credentials: false
      - name: README lint (sections, AI policy, generated blocks fresh, badges, paths, links)
        run: python3 tools/psxd_publish.py lint README.md
      - name: category ids frozen (retired, never deleted or renamed)
        run: python3 tools/psxd_publish.py categories config/categories.tsv --history
