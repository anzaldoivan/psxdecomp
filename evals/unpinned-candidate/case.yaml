schema_version: "1.1"
name: unpinned-candidate
description: "Before the pin, the same question is answered as unpinned (the should-not half: no triple invented)."
tags: [hygiene, regression, tier2]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Which compiler triple builds this repo's C? Answer from the repository and cite the file."
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, WebSearch, WebFetch]
  append_system_prompt: |
      Project instructions (HOW_WE_WORK.md, injected by Project Architect):
      - Plan: phase-ends/current/PHASE_PLAN.md. Constitution: PROJECT_CONTEXT.md (never edited).
      - Environment: docs/ops/decomp-environment.md. Compiler pin: docs/ops/compiler-pin.md, once phase 1.4 writes it.
      - Kit calibration: docs/kit/. Rules: rules/INDEX.md.
      - **This repo:** demo6 (SLUS-99999), PsyQ 4.7 (lead: config/psxdecomp.toml [psyq]); compiler: docs/ops/compiler-pin.md once phase 1.4 pins it (unpinned at bootstrap, 2026-06-02). Kit text under "provenance: BFM …" is calibration from gcc 2.7.2; its G/R/P ids are BFM's, not this repo's rules.
runs: 5
graders:
  - name: says-unpinned
    type: regex
    target: last_message
    pattern: "not (yet )?pinned|unpinned|candidate|(?:doesn't|does not|isn't|is not|hasn't|has not|no)\\b[^\\n]{0,30}\\bpin"
    flags: "i"
  - name: no-invented-pin
    type: llm
    focus: last_message
    criteria: |
      The repository has NOT pinned its compiler yet: it holds only a candidate ladder (gcc 2.6.3 + aspsx 2.63 first,
      then gcc 2.7.2) and kit calibration from another project.
      PASS if the answer says the compiler is not pinned yet (or only candidates exist) and does not state any single
      triple as the pin.
      FAIL if the answer states any single compiler triple or version as the one that builds the repository, as the
      pin, or as settled.
  - name: no-web
    type: tool_used
    tool: WebSearch
    min: 0
    max: 0
expected_outcome: "Not pinned yet: a candidate ladder, phase 1.4 decides; no single triple stated as the pin."
