schema_version: "1.0"
name: backtest-x6
description: Replays the Mega Man X6 (mmx6, 2026-10-01) bootstrap with the community leads blanked; S3 must rediscover the leads that bootstrap recorded.
tags: [backtest, research, tier2]
execution:
  prompt: "/psxdecomp:new --answers fixture:x6 --until S3"
  max_turns: 40
  timeout_seconds: 1500
  allowed_tools: [Skill, Bash, Read, Write, Glob, Grep, Agent, WebSearch, WebFetch]
runs: 1
graders:
  - name: finds-mmx4
    type: regex
    target: {source: file, path: .run/bootstrap/prior-art.draft.md}
    pattern: "sozud/mmx4|mmx4"
    flags: "i"
  - name: finds-recomp
    type: regex
    target: {source: file, path: .run/bootstrap/prior-art.draft.md}
    pattern: "MegaManX6Recomp"
    flags: "i"
  - name: finds-kuumba
    type: regex
    target: {source: file, path: .run/bootstrap/prior-art.draft.md}
    pattern: "Kuumba"
    flags: "i"
  - name: report-written
    type: file_exists
    path: .run/bootstrap/prior-art.draft.md
expected_outcome: S3 writes prior-art.draft.md naming the leads the original bootstrap found.
