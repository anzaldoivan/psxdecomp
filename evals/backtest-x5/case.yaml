schema_version: "1.0"
name: backtest-x5
description: Replays the Mega Man X5 (mmx5) bootstrap with the community leads blanked; S3 must rediscover the leads that bootstrap recorded, the MMX5 Improvement Project Addendum (a ROM hack's address workbook) among them, and Kuumba123's modding repositories, found since.
tags: [backtest, research, tier2]
execution:
  prompt: "/psxdecomp:new --answers fixture:x5 --until S3"
  max_turns: 40
  timeout_seconds: 1500
  allowed_tools: [Skill, Bash, Read, Write, Glob, Grep, Agent, WebSearch, WebFetch]
runs: 1
graders:
  - name: finds-recomp
    type: regex
    target: {source: file, path: .run/bootstrap/prior-art.draft.md}
    pattern: "MegaManX5Recomp"
    flags: "i"
  - name: finds-mmx4
    type: regex
    target: {source: file, path: .run/bootstrap/prior-art.draft.md}
    pattern: "sozud/mmx4|mmx4"
    flags: "i"
  - name: finds-addendum
    type: regex
    target: {source: file, path: .run/bootstrap/prior-art.draft.md}
    pattern: 'archive\.org/details/(mmx5_improvement_project_addendum|megamanx5improvementprojectaddendum)|romhacking\.net/hacks/6131'
    flags: "i"
  - name: finds-kuumba
    type: regex
    target: {source: file, path: .run/bootstrap/prior-art.draft.md}
    pattern: "Kuumba123"
    flags: "i"
  - name: report-written
    type: file_exists
    path: .run/bootstrap/prior-art.draft.md
expected_outcome: S3 writes prior-art.draft.md naming the leads the original bootstrap found, the ROM-hack workbook included.
