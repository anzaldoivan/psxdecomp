schema_version: "1.0"
name: backtest-bfm
description: Replays the Brave Fencer Musashi (BFM-decomp, 2026-06-10) bootstrap with the community leads blanked; S3 must rediscover the leads that bootstrap recorded.
tags: [backtest, research, tier2]
execution:
  prompt: "/psxdecomp:new --answers fixture:bfm --until S3"
  max_turns: 40
  timeout_seconds: 1500
  allowed_tools: [Skill, Bash, Read, Write, Glob, Grep, Agent, WebSearch, WebFetch]
runs: 1
graders:
  - name: finds-archipelago-or-gameshark
    type: regex
    target: {source: file, path: .run/bootstrap/prior-art.draft.md}
    pattern: "archipelago|gameshark"
    flags: "i"
  - name: finds-tcrf
    type: regex
    target: {source: file, path: .run/bootstrap/prior-art.draft.md}
    pattern: "tcrf"
    flags: "i"
  - name: report-written
    type: file_exists
    path: .run/bootstrap/prior-art.draft.md
expected_outcome: S3 writes prior-art.draft.md naming the leads the original bootstrap found.
