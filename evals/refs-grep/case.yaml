schema_version: "1.0"
name: refs-grep
description: In a bootstrapped repo, an SDK question is answered by grepping refs/, not by searching the web.
tags: [refs, tier2]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Which PsyQ library holds SpuSetKey? Answer from this repository's reference library."
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Bash, WebSearch, WebFetch]
runs: 1
graders:
  - name: grepped-refs
    type: tool_used
    tool: Grep
    input_match: "SpuSetKey"
    min: 1
  - name: no-web
    type: tool_used
    tool: WebSearch
    min: 0
    max: 0
  - name: answers-libspu
    type: regex
    target: last_message
    pattern: "libspu"
    flags: "i"
expected_outcome: The agent greps refs/ (as HOW_WE_WORK says), finds libspu, and cites the file.
