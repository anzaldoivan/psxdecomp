# splat config for the synthetic fixture exe (tier 1b). @SHA1@ is filled by smoke.sh from the extracted file.
name: HELLO.EXE
sha1: @SHA1@
options:
  basename: hello
  target_path: HELLO.EXE
  base_path: .
  platform: psx
  compiler: GCC
  asm_path: asm
  src_path: src
  build_path: build
  ld_script_path: build/hello.ld
  undefined_funcs_auto_path: undefined_funcs_auto.txt
  undefined_syms_auto_path: undefined_syms_auto.txt
  find_file_boundaries: False
  section_order: [".text", ".data", ".bss"]
segments:
  - name: header
    type: header
    start: 0x0
  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    subsegments:
      - [0x800, asm, main]
      - [0x820, data, stamps]
  - [0x1000]
