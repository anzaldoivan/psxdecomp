# compat.toml — the one record of what psxdecomp was tested against (psxrecomp's single-manifest rule, our own text).
# The installer refuses anything else unless --force-untested, which is written into the game repo as a deviation.
# Bumps follow docs/RELEASING.md: tiers 0-2 green on the new pin, then this file and docs/ECOSYSTEM.md change together.

[pa3]
repo    = "https://github.com/Druthulu/ProjectArchitect.git"
tag     = "v3.30.7"
sha     = "265217be05fe22378b0aa7bd4b43e65ab9abeebd"   # the commit the tag points at (refs/tags/v3.30.7^{})
version = "3.30.7"                                      # the package's VERSION line
subdir  = "project-architect-3.0"

[kit]
# decomp-architect ships inside BFM-decomp (no repository of its own yet). The tested kit is the `kit-pa3` branch of
# anzaldoivan/BFM-decomp, fetched shallow and sparse at `sha` (scripts/common.py resolve_kit); the content digest
# (tree_digest) is the second check. --kit or $PSXDECOMP_KIT overrides the fetch with a local folder (digest-checked).
repo         = "https://github.com/anzaldoivan/BFM-decomp.git"
sha          = "35a07b04f90cf5c9e70fefcd05305e8809206fc3"     # branch anzaldoivan/kit-pa3, 2026-10-24 (PA 3.3 text)
subdir       = "decomp-architect"
digest       = "sha256:d16cdcc5f2c6972c2cd397d52b0cedd1fc0386c7441607344efafaaba7c78207"
tested_pa3   = "3.30.7"                                 # the kit's own TESTED_PA3 (tier 1 runs it on the [pa3] pin)
default_path = ""

[tested_on]
date    = "2026-10-24"
hosts   = ["macOS 27 arm64 + Docker Desktop (amd64 emulation)"]
claude  = "2.1.303"                                    # PA3 3.30.7 needs 2.1.292 or newer. Local tiers 0-3 of 2026-10-24
                                                       # ran on 2.1.310, whose `plugin validate` warns: no icon
python  = ["3.14"]
